name: PostgreSQL Database Migration & Validation

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master, staging ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psqlmigr-core
        run: |
          python -m pip install --upgrade pip
          pip install ./core_engine

      - name: Configure Database Environment
        run: |
          psqlmigr set-env --host localhost --port 5432 --user postgres --password postgrespassword --database test_db

      - name: Test Connection
        run: |
          psqlmigr test-connection

      - name: Validate Migrations (Dry-Run Debug)
        run: |
          psqlmigr validate

      - name: Apply Migrations
        run: |
          psqlmigr apply

      - name: Check Final Status
        run: |
          psqlmigr status
