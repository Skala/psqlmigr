[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psqlmigr-core"
version = "0.1.0"
description = "Core CLI engine for PostgreSQL declarative schema management and migrations."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "psqlmigr Team" }
]
dependencies = [
    "typer>=0.12.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=25.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
psqlmigr = "psqlmigr.cli:app"

[tool.setuptools.packages.find]
where = ["."]
